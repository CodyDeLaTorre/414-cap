    <main id="main">
      <section class="band band--hero u-text-center band--tight">
        <div class="container">
          <h1 class="tracked-caps">Contact</h1>
        </div>
      </section>

      <section class="band band--experience">
        <div class="container" style="max-width: 34rem;">
          <div class="window-card">
            <div class="window-card__chrome" aria-hidden="true">
              <span class="window-card__dot"></span>
              <span class="window-card__dot"></span>
              <span class="window-card__dot"></span>
            </div>
            <div class="window-card__body">
              <p class="u-text-muted" style="margin-bottom: var(--space-6);">Fields marked with * are required.</p>

              <form class="stack">
                <div class="field">
                  <label class="field__label" for="name" data-required>Name</label>
                  <input class="field__input" type="text" id="name" name="name" required />
                  <p class="field__error" role="alert">Please enter your name.</p>
                </div>

                <div class="field">
                  <label class="field__label" for="email" data-required>Email</label>
                  <input class="field__input" type="email" id="email" name="email" required />
                  <p class="field__hint">We'll only use this to reply to you.</p>
                  <p class="field__error" role="alert">Please enter a valid email address.</p>
                </div>

                <div class="field">
                  <label class="field__label" for="message" data-required>Message</label>
                  <textarea class="field__input" id="message" name="message" rows="5" required></textarea>
                  <p class="field__error" role="alert">Please enter a message.</p>
                </div>

                <button class="btn" type="submit">Send message</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
